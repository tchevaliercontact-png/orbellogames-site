<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbello Games</title>
  <meta name="description" content="Orbello Games, éditeur du jeu mobile Tilenauts. Publisher of the Tilenauts mobile game.">
  <style>
    :root { --bg: #0b1033; --ink: #1b2150; --accent: #ffcc33; --violet: #5a2fd6; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
      background: radial-gradient(ellipse at 50% 0%, #24307a, var(--bg) 70%);
    }
    main { max-width: 520px; width: 100%; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 34px; }
    p { margin: 0 0 18px; opacity: 0.9; }
    .card { background: #fff; color: var(--ink); border-radius: 20px; padding: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
    .card h2 { margin: 0 0 6px; font-size: 22px; color: var(--violet); }
    a.button {
      display: inline-block; margin: 6px 4px 0; padding: 10px 18px; border-radius: 22px;
      background: var(--accent); color: var(--ink); font-weight: 800; text-decoration: none;
    }
    a { color: var(--violet); }
    footer { margin-top: 22px; font-size: 14px; opacity: 0.85; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Orbello Games</h1>
    <p>Jeux mobiles pour toute la famille · Mobile games for the whole family</p>
    <div class="card">
      <h2>Tilenauts</h2>
      <p>Trie les tuiles et bâtis des monuments de planète en planète. · Sort tiles and build monuments from planet to planet.</p>
      <a class="button" href="privacy.html?lang=fr">Confidentialité</a>
      <a class="button" href="privacy.html?lang=en">Privacy</a>
    </div>
    <footer>Contact : <a href="mailto:contact@orbellogames.store">contact@orbellogames.store</a></footer>
  </main>
</body>
</html>
